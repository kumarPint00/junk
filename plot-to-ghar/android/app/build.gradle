plugins { id 'com.android.application' }

def releaseStore = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'com.plottoghar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.plottoghar.app'
        minSdk 26
        targetSdk 35
        versionCode 250
        versionName '2.5.0'
        buildConfigField 'String', 'APP_URL', '"https://plot-to-ghar.vercel.app"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
