name: Plot to Ghar Production Android APK

on:
  push:
    branches: [main]
    tags: ['ptg-v*']
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_API_BASE_URL: https://plot-to-ghar-kumarpint00.vercel.app
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Financial integrity tests
        run: npm run test
      - name: Build production web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android

      - name: Ensure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify and stage debug APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Plot-to-Ghar-production-debug.apk
          unzip -t Plot-to-Ghar-production-debug.apk >/dev/null
          sha256sum Plot-to-Ghar-production-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-production-apk
          path: Plot-to-Ghar-production-debug.apk
          retention-days: 30

      - name: Configure stable release signing
        if: env.RELEASE_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/plot-to-ghar-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ env.RELEASE_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          python3 scripts/configure-android-signing.py
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify and stage release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Plot-to-Ghar-production-release.apk
          unzip -t Plot-to-Ghar-production-release.apk >/dev/null
          sha256sum Plot-to-Ghar-production-release.apk

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_B64 != ''
        with:
          name: plot-to-ghar-production-release-apk
          path: Plot-to-Ghar-production-release.apk
          retention-days: 90
