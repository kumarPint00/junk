name: Plot to Ghar Android APK

on:
  push:
    branches: [main, plot-to-ghar-production-ready, plot-to-ghar-standalone-production]
    paths:
      - 'plot-to-ghar/android/**'
      - 'plot-to-ghar/web/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plot-to-ghar/android/**'
      - 'plot-to-ghar/web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plot-to-ghar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: plot-to-ghar/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing when secrets exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plot-to-ghar-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/plot-to-ghar-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release-keystore" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../../Plot-to-Ghar-2.5.0.apk
          unzip -t ../../Plot-to-Ghar-2.5.0.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../../Plot-to-Ghar-2.5.0.apk
          sha256sum ../../Plot-to-Ghar-2.5.0.apk | tee ../../Plot-to-Ghar-2.5.0.sha256
          printf 'signing_mode=%s\ncommit=%s\n' "$SIGNING_MODE" "$GITHUB_SHA" > ../../Plot-to-Ghar-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-apk-${{ github.sha }}
          path: |
            Plot-to-Ghar-2.5.0.apk
            Plot-to-Ghar-2.5.0.sha256
            Plot-to-Ghar-build-info.txt
          retention-days: 30
          if-no-files-found: error
