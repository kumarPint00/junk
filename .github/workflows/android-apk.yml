name: Plot to Ghar Android APK
on:
  push:
    branches: [main]
    paths:
      - 'plot-to-ghar/android/**'
      - 'plot-to-ghar/.ci-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: plot-to-ghar/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../../Plot-to-Ghar-production-debug.apk
          sha256sum ../../Plot-to-Ghar-production-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-production-apk
          path: Plot-to-Ghar-production-debug.apk
          retention-days: 30
