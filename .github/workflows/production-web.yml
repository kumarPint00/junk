name: Production Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'tsconfig*.json'
      - 'capacitor.config.ts'
      - '.github/workflows/production-web.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Financial integrity tests
        run: npm run test
      - name: TypeScript + production build
        run: npm run build
      - name: Upload verified web bundle
        uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-production-web
          path: dist
          retention-days: 14
