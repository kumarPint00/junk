name: Bootstrap Plot to Ghar Production Source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/plot-to-ghar-prod.b64', '.github/workflows/bootstrap-plot-to-ghar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/plot-to-ghar-prod.b64 > /tmp/ptg.tgz
          tar -xzf /tmp/ptg.tgz
          test -f plot-to-ghar/web/package.json
          test -f plot-to-ghar/android/app/src/main/java/com/plottoghar/app/MainActivity.java
          test -f .github/workflows/ci.yml
          test -f .github/workflows/android-apk.yml
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plot-to-ghar .github/workflows/ci.yml .github/workflows/android-apk.yml
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Add Plot to Ghar production monorepo [skip ci]"
            git push origin HEAD:main
          fi
