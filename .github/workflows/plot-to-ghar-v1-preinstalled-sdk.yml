name: Build Plot to Ghar V1 APK (preinstalled SDK)

on:
  push:
    branches: [plot-to-ghar-v1-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V1 source
        shell: bash
        run: |
          cat buildsrc/part*.b64 | tr -d '\n' | base64 -d > /tmp/plot-v1-src.tgz
          tar -xzf /tmp/plot-v1-src.tgz
          test -f app/src/main/java/com/plottoghar/v1/MainActivity.java
          test -f app/src/main/java/com/plottoghar/v1/DbHelper.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk plot-to-ghar-v1.apk
          sha256sum plot-to-ghar-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-v1-apk-preinstalled
          path: plot-to-ghar-v1.apk
          if-no-files-found: error
          retention-days: 30
