name: Build Plot to Ghar Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'ptg-v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_API_BASE_URL: https://plot-to-ghar-kumarpint00.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Run financial integrity tests
        run: npm run test

      - name: Build web bundle
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare debug artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk plot-to-ghar-debug.apk
          sha256sum plot-to-ghar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-debug-apk
          path: plot-to-ghar-debug.apk
          retention-days: 30

      - name: Configure stable release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/plot-to-ghar-release.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          python3 scripts/configure-android-signing.py
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk plot-to-ghar-release.apk
          sha256sum plot-to-ghar-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: plot-to-ghar-release-apk
          path: plot-to-ghar-release.apk
          retention-days: 90
