name: Plot to Ghar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: plot-to-ghar-web-dist
          path: dist
          retention-days: 7
