<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7f00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b00000;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#f5f0e8"/>

  <!-- Main Text -->
  <text x="50" y="250" font-family="Georgia, serif" font-size="180" fill="url(#grad1)">
    Swadika
  </text>

  <!-- Tagline Text -->
  <text x="50" y="350" font-family="Georgia, serif" font-size="48" fill="#4b2e2a">
    GhareluDelights
  </text>

  <!-- Pot Icon -->
  <g transform="translate(200, 380) scale(1.5)">
    <!-- Pot Body -->
    <path d="M50 100 Q50 50 100 50 L200 50 Q250 50 250 100 L250 150 Q250 200 200 200 L100 200 Q50 200 50 150 Z" fill="#4b2e2a"/>
    <!-- Handle -->
    <circle cx="260" cy="125" r="15" fill="#4b2e2a"/>
    <!-- Ladle -->
    <path d="M80 50 L60 0" stroke="#4b2e2a" stroke-width="15" stroke-linecap="round"/>
    <circle cx="55" cy="5" r="10" fill="#4b2e2a"/>
    <!-- Steam -->
    <path d="M150 10 C140 -20 170 -20 160 10" stroke="#4b2e2a" stroke-width="10" fill="none"/>
  </g>
</svg>
